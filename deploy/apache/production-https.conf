<VirtualHost *:443>
    ServerName granbertafilms.com
    ServerAlias www.granbertafilms.com
    ServerAdmin admin@example.com

    DocumentRoot /var/www/granberta-nueva/current
    <Directory /var/www/granberta-nueva>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        SetHandler None
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|py|sh|env|sql)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorDocument 404 /404.html
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.granbertafilms\.com$ [NC]
    RewriteRule ^ https://granbertafilms.com%{REQUEST_URI} [R=301,L]

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/granbertafilms.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/granbertafilms.com/privkey.pem
</VirtualHost>
