# Include only inside the existing HTTPS VirtualHost for granbertafilms.com.
# The WordPress DocumentRoot and its files remain unchanged.
RedirectMatch 302 ^/preview$ /preview/
Alias /preview/ /var/www/granberta-nueva/preview/
<Directory /var/www/granberta-nueva>
    Options -Indexes -ExecCGI +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    SetHandler None
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|py|sh|env|sql)$">
        Require all denied
    </FilesMatch>
</Directory>
<Location /preview/>
    ErrorDocument 404 /preview/404.html
    <IfModule mod_headers.c>
        Header always set X-Robots-Tag "noindex, nofollow"
        Header always set Cache-Control "no-cache"
    </IfModule>
</Location>
